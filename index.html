<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epicycles</title>
    <style>
        :root {
            --bg: #0a0e22;
            --chain-x: #A89CC9;
            --chain-y: #F5C99B;
            --connector: #A8A5B3;
            --trail: 240, 239, 234;
            --overlay: rgba(88, 104, 212, 0.9);
            --pen: #F0EFEA;
            --accent: #A89CC9;
            --accent-soft: #2A2438;
            --accent-deep: #D4C8E8;
            --navy: #5868D4;
            --canvas-2: #171E3A;
            --line: #262E4A;
            --ink: #F0EFEA;
            --ink-muted: #A8A5B3;
            --success: #9AD0AC;
            --warning: #F5C99B;
            --danger: #E8A0A0;
            --danger-deep: #8C5A5A;
            --info: #B5C2EB;
            --sparkle: linear-gradient(135deg, #3B4BCC 0%, #A89CC9 30%, #D4A5BE 65%, #D8B89E 100%);
        }
        [data-theme="light"] {
            --bg: #ffffff;
            --chain-x: #6B5B8F;
            --chain-y: #B07A4A;
            --connector: #5E647A;
            --trail: 26, 31, 61;
            --overlay: rgba(184, 167, 217, 0.9);
            --pen: #1A1F3D;
            --accent: #B8A7D9;
            --accent-soft: #EBE4F5;
            --accent-deep: #6B5B8F;
            --navy: #3B4BCC;
            --canvas-2: #FBFAF7;
            --line: #E7E5E0;
            --ink: #1A1F3D;
            --ink-muted: #5E647A;
            --success: #9AD0AC;
            --warning: #F5C99B;
            --danger: #E8A0A0;
            --danger-deep: #8C5A5A;
            --info: #B5C2EB;
            --sparkle: linear-gradient(135deg, #3B4BCC 0%, #B8A7D9 30%, #F5C2D8 65%, #F8C9B0 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
        canvas { display: block; width: 100vw; height: 100vh; }
        #menu {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 280px;
            padding: 12px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--canvas-2) 82%, transparent);
            border: 1px solid var(--line);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            font-size: 12px;
            color: var(--ink);
            z-index: 10;
        }
        #menuHeader { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        #menuHeader .title {
            font-weight: 700;
            font-size: 16px;
            background: var(--sparkle);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #menuToggle {
            font: inherit;
            color: var(--ink);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 4px 10px;
            cursor: pointer;
        }
        #themeSwitch {
            display: inline-flex;
            gap: 2px;
            margin-left: auto;
            padding: 2px;
            font: inherit;
            color: var(--ink-muted);
            background: var(--canvas-2);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }
        #themeSwitch span { padding: 3px 8px; border-radius: 999px; }
        [data-theme="dark"] #themeSwitch [data-seg="dark"],
        [data-theme="light"] #themeSwitch [data-seg="light"] {
            background: color-mix(in srgb, var(--accent) 35%, var(--canvas-2));
            color: var(--ink);
        }
        .visuallyHidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        #menu .menuBody { display: flex; flex-direction: column; gap: 8px; }
        #menu .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
        #menu .formula { font-variant-numeric: tabular-nums; }
        #menu #errorDisplay {
            align-self: flex-start;
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--canvas-2);
            border: 1px solid var(--line);
            color: var(--ink);
        }
        #menu #legend { display: flex; flex-wrap: wrap; gap: 8px; }
        #menu .legendEntry { display: inline-flex; align-items: center; gap: 8px; }
        #menu .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 4px; flex: none; }
        #menu svg { width: 1em; height: 1em; flex: none; vertical-align: middle; }
        [data-theme="dark"] #themeSwitch .icon-sun { display: none; }
        [data-theme="light"] #themeSwitch .icon-moon { display: none; }
        #pauseBtn { display: inline-flex; align-items: center; gap: 8px; }
        #pauseBtn[data-paused="false"] .icon-play { display: none; }
        #pauseBtn[data-paused="true"] .icon-pause { display: none; }
        #menu summary {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 8px 16px;
            cursor: pointer;
        }
        #menu summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        #menu .menuBody button {
            font: inherit;
            color: var(--ink);
            background: var(--canvas-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 8px 16px;
            min-height: 44px;
            width: auto;
            align-self: flex-start;
            cursor: pointer;
        }
        #menu .menuBody button:hover { background: color-mix(in srgb, var(--accent) 16%, var(--canvas-2)); }
        #menu .menuBody button:active { background: color-mix(in srgb, var(--accent) 28%, var(--canvas-2)); }
        #menu .menuBody button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        #menu input[type="range"] { width: 100%; accent-color: var(--accent); }
        @media (max-width: 720px) {
            #menu { top: 0; left: 0; right: 0; width: auto; height: 56px; border-radius: 0; overflow: hidden; }
            #menu .menuBody { display: none; }
            #menu.open { height: auto; overflow: visible; }
            #menu.open .menuBody { display: flex; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <aside id="menu">
        <header id="menuHeader">
            <span class="title">Epicycles</span>
            <button id="themeSwitch" aria-label="Theme">
                <svg class="icon-sun" aria-hidden="true" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="3.2"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="8" y1="0.8" x2="8" y2="2.4"/><line x1="8" y1="13.6" x2="8" y2="15.2"/><line x1="0.8" y1="8" x2="2.4" y2="8"/><line x1="13.6" y1="8" x2="15.2" y2="8"/><line x1="2.9" y1="2.9" x2="4" y2="4"/><line x1="12" y1="12" x2="13.1" y2="13.1"/><line x1="2.9" y1="13.1" x2="4" y2="12"/><line x1="12" y1="4" x2="13.1" y2="2.9"/></g></svg>
                <svg class="icon-moon" aria-hidden="true" viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
                <span data-seg="dark">Dark</span>
                <span data-seg="light">Light</span>
            </button>
            <span id="themeLabel" class="visuallyHidden">Dark</span>
            <button id="menuToggle" aria-label="Menu"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>
        </header>
        <div class="menuBody">
            <input type="file" id="svgInput" accept=".svg" style="display: none;" />
            <button id="svgBtn">Load SVG</button>
            <div class="row"><span class="label">N</span><span id="nValue">1024</span></div>
            <input type="range" id="nSlider" min="0" max="13" value="10" />
            <div class="row"><span class="label">Speed</span><span id="speedValue">0.1</span></div>
            <input type="range" id="speedSlider" min="0" max="8" value="1" />
            <div class="row"><span class="label">Fade</span><span id="fadeValue">0%</span></div>
            <input type="range" id="fadeSlider" min="0" max="10" step="1" value="0" />
            <div id="errorDisplay">approximation error = ?%</div>
            <div id="legend">
                <span class="legendEntry"><span class="swatch" style="background: var(--chain-x)"></span>x chain</span>
                <span class="legendEntry"><span class="swatch" style="background: var(--chain-y)"></span>y chain</span>
            </div>
            <button id="pauseBtn" data-paused="false"><svg class="icon-pause" aria-hidden="true" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg><svg class="icon-play" aria-hidden="true" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5l7 4.5-7 4.5z"/></svg><span id="pauseLabel">Pause</span></button>
            <button id="originalBtn">Show original</button>
            <details id="howItWorks">
                <summary>How it works</summary>
                <div class="formula">x(t) = Σ rₖ cos(kt + φₖ)</div>
                <div class="formula">y(t) = Σ rₖ cos(kt + φₖ)</div>
                <p>Two real FFT chains: one drives x (drawn on top), one drives y (on the left); the harmonics are sorted by magnitude.</p>
            </details>
        </div>
    </aside>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const SPEED_STEPS = [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1, 2, 5];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // FFT: Cooley-Tukey radix-2 DIT
        // Input: array of {re, im} length N=2^k
        function fft(input) {
            const N = input.length;
            if (N <= 1) return input.slice();

            // Bit-reversal permutation
            const output = new Array(N);
            for (let i = 0; i < N; i++) {
                let j = 0;
                for (let k = 0; k < Math.log2(N); k++) {
                    j = (j << 1) | ((i >> k) & 1);
                }
                output[j] = {re: input[i].re, im: input[i].im};
            }

            // Butterfly operations
            let size = 2;
            while (size <= N) {
                const half = size / 2;
                const angle = -2 * Math.PI / size;
                const w = {re: Math.cos(angle), im: Math.sin(angle)};
                for (let i = 0; i < N; i += size) {
                    let w_pow = {re: 1, im: 0};
                    for (let j = 0; j < half; j++) {
                        const a = output[i + j];
                        const b = output[i + j + half];
                        const twiddle = {
                            re: w_pow.re * b.re - w_pow.im * b.im,
                            im: w_pow.re * b.im + w_pow.im * b.re
                        };
                        output[i + j] = {
                            re: a.re + twiddle.re,
                            im: a.im + twiddle.im
                        };
                        output[i + j + half] = {
                            re: a.re - twiddle.re,
                            im: a.im - twiddle.im
                        };
                        const temp = w_pow;
                        w_pow = {
                            re: temp.re * w.re - temp.im * w.im,
                            im: temp.re * w.im + temp.im * w.re
                        };
                    }
                }
                size *= 2;
            }
            return output;
        }

        // Inverse FFT
        function ifft(input) {
            const N = input.length;
            const conj = input.map(z => ({re: z.re, im: -z.im}));
            const result = fft(conj);
            return result.map(z => ({re: z.re / N, im: z.im / N}));
        }

        // Compute Fourier coefficients from path points
        // Points: array of {x, y}
        // Returns {x: [...], y: [...]} with separate harmonic arrays for each dimension
        function computeFourier(points) {
            const N = points.length;
            // Center the path
            let cx = 0, cy = 0;
            for (let i = 0; i < N; i++) {
                cx += points[i].x;
                cy += points[i].y;
            }
            cx /= N;
            cy /= N;

            // Build separate real signals for x and y
            const xSignal = points.map(p => ({ re: p.x - cx, im: 0 }));
            const ySignal = points.map(p => ({ re: p.y - cy, im: 0 }));

            // FFT each separately (real FFT via complex FFT with zero imaginary part)
            const xCoeffs = fft(xSignal);
            const yCoeffs = fft(ySignal);

            // Convert to harmonic representation for each dimension
            function toHarmonics(coeffs, N) {
                const magnitudes = coeffs.map((c, i) => ({
                    index: i,
                    magnitude: Math.sqrt(c.re * c.re + c.im * c.im),
                    re: c.re,
                    im: c.im
                }));
                magnitudes.sort((a, b) => b.magnitude - a.magnitude);

                const result = [];
                for (let i = 0; i < magnitudes.length; i++) {
                    const m = magnitudes[i];
                    const k = m.index;
                    let speed = k;
                    if (k > N / 2) speed = k - N; // Negative frequencies
                    const phase = Math.atan2(m.im, m.re);
                    result.push({
                        radius: m.magnitude / N,
                        speed: speed,
                        phase: phase
                    });
                }
                return result;
            }

            return {
                x: toHarmonics(xCoeffs, N),
                y: toHarmonics(yCoeffs, N)
            };
        }

        // SVG parsing and path extraction

        // A 2x3 affine matrix [a,b,c,d,e,f] maps (x,y) -> (a*x + c*y + e, b*x + d*y + f).
        function multiplyMatrix(m, n) {
            return [
                m[0] * n[0] + m[2] * n[1],
                m[1] * n[0] + m[3] * n[1],
                m[0] * n[2] + m[2] * n[3],
                m[1] * n[2] + m[3] * n[3],
                m[0] * n[4] + m[2] * n[5] + m[4],
                m[1] * n[4] + m[3] * n[5] + m[5]
            ];
        }

        // One transform function -> matrix. A wrong argument count or a
        // non-finite argument yields the identity.
        function transformFunction(name, args) {
            const identity = [1, 0, 0, 1, 0, 0];
            let finite = true;
            for (let i = 0; i < args.length; i++) {
                if (!Number.isFinite(args[i])) finite = false;
            }
            if (!finite) return identity;
            if (name === 'translate') {
                if (args.length !== 1 && args.length !== 2) return identity;
                return [1, 0, 0, 1, args[0], args.length === 2 ? args[1] : 0];
            }
            if (name === 'scale') {
                if (args.length !== 1 && args.length !== 2) return identity;
                return [args[0], 0, 0, args.length === 2 ? args[1] : args[0], 0, 0];
            }
            if (name === 'rotate') {
                if (args.length !== 1 && args.length !== 3) return identity;
                const rad = args[0] * Math.PI / 180;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);
                if (args.length === 1) return [cos, sin, -sin, cos, 0, 0];
                const cx = args[1];
                const cy = args[2];
                return [cos, sin, -sin, cos, cx - cx * cos + cy * sin, cy - cx * sin - cy * cos];
            }
            if (name === 'matrix') {
                if (args.length !== 6) return identity;
                return args.slice();
            }
            if (name === 'skewX') {
                if (args.length !== 1) return identity;
                return [1, 0, Math.tan(args[0] * Math.PI / 180), 1, 0, 0];
            }
            if (name === 'skewY') {
                if (args.length !== 1) return identity;
                return [1, Math.tan(args[0] * Math.PI / 180), 0, 1, 0, 0];
            }
            return identity;
        }

        // Parse an SVG transform list into one matrix: entries compose left to
        // right (matrix M*N applies N first). An entry with an unknown name, a
        // wrong argument count or a non-finite argument is skipped (identity),
        // so the result is always finite.
        function parseTransform(str) {
            let matrix = [1, 0, 0, 1, 0, 0];
            if (typeof str !== 'string') return matrix;
            const re = /([a-zA-Z]+)\s*\(([^)]*)\)/g;
            let match;
            while ((match = re.exec(str)) !== null) {
                const parts = match[2].split(/[\s,]+/);
                const args = [];
                for (let i = 0; i < parts.length; i++) {
                    if (parts[i].length > 0) args.push(parseFloat(parts[i]));
                }
                matrix = multiplyMatrix(matrix, transformFunction(match[1], args));
            }
            return matrix;
        }

        function parseSVG(svgText) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgText, 'image/svg+xml');
            const fragments = [];
            const SKIP_TAGS = { defs: true, clippath: true, mask: true, symbol: true };
            const IDENTITY = [1, 0, 0, 1, 0, 0];

            function mapFragment(pts, matrix) {
                if (pts.length === 0) return;
                const out = new Array(pts.length);
                for (let k = 0; k < pts.length; k++) {
                    const p = pts[k];
                    out[k] = {
                        x: matrix[0] * p.x + matrix[2] * p.y + matrix[4],
                        y: matrix[1] * p.x + matrix[3] * p.y + matrix[5]
                    };
                }
                for (let k = 0; k < out.length; k++) {
                    if (!Number.isFinite(out[k].x) || !Number.isFinite(out[k].y)) return;
                }
                fragments.push(out);
            }

            function isHidden(el) {
                if (el.getAttribute('display') === 'none') return true;
                const style = el.getAttribute('style');
                if (typeof style === 'string' && /display\s*:\s*none/.test(style)) return true;
                return false;
            }

            function walk(el, parentMatrix) {
                // Match by local name: a namespaced document (`<svg:path>`,
                // some Office/Java exporters) has a qualified `tagName`.
                const tag = (el.localName || el.tagName).toLowerCase();
                if (SKIP_TAGS[tag]) return;
                if (isHidden(el)) return;
                const matrix = multiplyMatrix(parentMatrix, parseTransform(el.getAttribute('transform')));
                if (tag === 'path') {
                    const d = el.getAttribute('d');
                    if (d === null || d === '') return;
                    const subs = parsePath(d);
                    for (let j = 0; j < subs.length; j++) mapFragment(subs[j], matrix);
                    return;
                }
                if (tag === 'line') { mapFragment(parseLine(el), matrix); return; }
                if (tag === 'polyline') { mapFragment(parsePolyline(el), matrix); return; }
                if (tag === 'circle') { mapFragment(parseCircle(el), matrix); return; }
                const children = el.children;
                if (!children) return;
                for (let i = 0; i < children.length; i++) {
                    walk(children[i], matrix);
                }
            }

            if (doc && doc.documentElement) {
                walk(doc.documentElement, IDENTITY);
            }
            return fragments;
        }

        // Tokenise a path `d` string into command letters and numbers,
        // handling compact forms like `1e-3`, `-1-2`, `.5.5`, `1e1-1e1`.
        function tokenizePath(d) {
            const tokens = [];
            let i = 0;
            const n = d.length;
            let cmd = null;
            let arcIndex = 0;
            while (i < n) {
                const c = d[i];
                if (c === ' ' || c === '\t' || c === '\n' || c === '\r' || c === ',' || c === ';') {
                    i++;
                } else if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
                    tokens.push(c);
                    cmd = c;
                    arcIndex = 0;
                    i++;
                } else {
                    const isArc = cmd === 'A' || cmd === 'a';
                    const slot = arcIndex % 7;
                    if (isArc && (slot === 3 || slot === 4) && (c === '0' || c === '1')) {
                        tokens.push(parseFloat(c));
                        arcIndex++;
                        i++;
                    } else {
                        const m = d.slice(i).match(/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
                        if (m) {
                            tokens.push(parseFloat(m[0]));
                            arcIndex++;
                            i += m[0].length;
                        } else {
                            i++;
                        }
                    }
                }
            }
            return tokens;
        }

        // Fixed sampling density for curves and arcs.
        const CURVE_STEPS = 64;

        function sampleCubic(frag, x0, y0, x1, y1, x2, y2, x3, y3) {
            for (let k = 1; k <= CURVE_STEPS; k++) {
                const t = k / CURVE_STEPS;
                const u = 1 - t;
                frag.push({
                    x: u*u*u*x0 + 3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t*x3,
                    y: u*u*u*y0 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y3
                });
            }
        }

        function sampleQuadratic(frag, x0, y0, x1, y1, x2, y2) {
            for (let k = 1; k <= CURVE_STEPS; k++) {
                const t = k / CURVE_STEPS;
                const u = 1 - t;
                frag.push({
                    x: u*u*x0 + 2*u*t*x1 + t*t*x2,
                    y: u*u*y0 + 2*u*t*y1 + t*t*y2
                });
            }
        }

        // Endpoint -> centre parameterisation (SVG 1.1, annex F.6.5), then sample.
        function sampleArc(frag, x1, y1, rx, ry, phiDeg, fA, fS, x2, y2) {
            if (x1 === x2 && y1 === y2) return;
            const phi = phiDeg * Math.PI / 180;
            const cosPhi = Math.cos(phi);
            const sinPhi = Math.sin(phi);
            const dx2 = (x1 - x2) / 2;
            const dy2 = (y1 - y2) / 2;
            const x1p = cosPhi * dx2 + sinPhi * dy2;
            const y1p = -sinPhi * dx2 + cosPhi * dy2;
            let rxs = Math.abs(rx);
            let rys = Math.abs(ry);
            const lambda = (x1p * x1p) / (rxs * rxs) + (y1p * y1p) / (rys * rys);
            if (lambda > 1) {
                const s = Math.sqrt(lambda);
                rxs *= s;
                rys *= s;
            }
            const rx2 = rxs * rxs;
            const ry2 = rys * rys;
            const num = rx2 * ry2 - rx2 * y1p * y1p - ry2 * x1p * x1p;
            const denom = rx2 * y1p * y1p + ry2 * x1p * x1p;
            const coef = ((fA !== fS) ? 1 : -1) * Math.sqrt(Math.max(0, num / denom));
            const cxp = coef * (rxs * y1p / rys);
            const cyp = coef * (-rys * x1p / rxs);
            const cx = cosPhi * cxp - sinPhi * cyp + (x1 + x2) / 2;
            const cy = sinPhi * cxp + cosPhi * cyp + (y1 + y2) / 2;
            function angleOf(ax, ay, bx, by) {
                const dot = ax * bx + ay * by;
                const cross = ax * by - ay * bx;
                return Math.atan2(cross, dot);
            }
            const theta1 = angleOf(1, 0, (x1p - cxp) / rxs, (y1p - cyp) / rys);
            let delta = angleOf((x1p - cxp) / rxs, (y1p - cyp) / rys, (-x1p - cxp) / rxs, (-y1p - cyp) / rys);
            if (fS === 0 && delta > 0) delta -= 2 * Math.PI;
            if (fS === 1 && delta < 0) delta += 2 * Math.PI;
            for (let k = 1; k <= CURVE_STEPS; k++) {
                const theta = theta1 + (k / CURVE_STEPS) * delta;
                const ct = Math.cos(theta);
                const st = Math.sin(theta);
                frag.push({
                    x: cx + rxs * cosPhi * ct - rys * sinPhi * st,
                    y: cy + rxs * sinPhi * ct + rys * cosPhi * st
                });
            }
        }

        function parsePath(d) {
            const tokens = tokenizePath(d);
            const fragments = new Array();
            let current = null;
            let cx = 0, cy = 0;
            let sx = 0, sy = 0;
            let lastCubic = null;
            let lastQuad = null;

            function beginFragment() {
                current = new Array();
                current.push({x: sx, y: sy});
                fragments.push(current);
                cx = sx;
                cy = sy;
            }

            function ensureFragment() {
                if (current === null) beginFragment();
            }

            function addPoint(x, y) {
                current.push({x: x, y: y});
                cx = x;
                cy = y;
            }

            let i = 0;
            while (i < tokens.length) {
                const cmd = tokens[i];
                if (typeof cmd !== 'string') break;
                i++;
                const rel = cmd === cmd.toLowerCase();
                const C = cmd.toUpperCase();
                if (C === 'M') {
                    let x = tokens[i++], y = tokens[i++];
                    if (rel) { x += cx; y += cy; }
                    sx = x;
                    sy = y;
                    lastCubic = null;
                    lastQuad = null;
                    beginFragment();
                    while (i + 1 < tokens.length && typeof tokens[i] === 'number' && typeof tokens[i + 1] === 'number') {
                        let lx = tokens[i++], ly = tokens[i++];
                        if (rel) { lx += cx; ly += cy; }
                        addPoint(lx, ly);
                    }
                } else if (C === 'L') {
                    ensureFragment();
                    while (i + 1 < tokens.length && typeof tokens[i] === 'number' && typeof tokens[i + 1] === 'number') {
                        let x = tokens[i++], y = tokens[i++];
                        if (rel) { x += cx; y += cy; }
                        addPoint(x, y);
                    }
                } else if (C === 'H') {
                    ensureFragment();
                    while (i < tokens.length && typeof tokens[i] === 'number') {
                        let x = tokens[i++];
                        if (rel) x += cx;
                        addPoint(x, cy);
                    }
                } else if (C === 'V') {
                    ensureFragment();
                    while (i < tokens.length && typeof tokens[i] === 'number') {
                        let y = tokens[i++];
                        if (rel) y += cy;
                        addPoint(cx, y);
                    }
                } else if (C === 'C') {
                    ensureFragment();
                    while (i + 5 < tokens.length && typeof tokens[i] === 'number') {
                        let x1 = tokens[i], y1 = tokens[i + 1], x2 = tokens[i + 2];
                        let y2 = tokens[i + 3], x = tokens[i + 4], y = tokens[i + 5];
                        i += 6;
                        if (rel) { x1 += cx; y1 += cy; x2 += cx; y2 += cy; x += cx; y += cy; }
                        sampleCubic(current, cx, cy, x1, y1, x2, y2, x, y);
                        lastCubic = {x: x2, y: y2};
                        cx = x;
                        cy = y;
                    }
                } else if (C === 'S') {
                    ensureFragment();
                    while (i + 3 < tokens.length && typeof tokens[i] === 'number') {
                        let x2 = tokens[i], y2 = tokens[i + 1], x = tokens[i + 2], y = tokens[i + 3];
                        i += 4;
                        if (rel) { x2 += cx; y2 += cy; x += cx; y += cy; }
                        const x1 = lastCubic ? 2 * cx - lastCubic.x : cx;
                        const y1 = lastCubic ? 2 * cy - lastCubic.y : cy;
                        sampleCubic(current, cx, cy, x1, y1, x2, y2, x, y);
                        lastCubic = {x: x2, y: y2};
                        cx = x;
                        cy = y;
                    }
                } else if (C === 'Q') {
                    ensureFragment();
                    while (i + 3 < tokens.length && typeof tokens[i] === 'number') {
                        let x1 = tokens[i], y1 = tokens[i + 1], x = tokens[i + 2], y = tokens[i + 3];
                        i += 4;
                        if (rel) { x1 += cx; y1 += cy; x += cx; y += cy; }
                        sampleQuadratic(current, cx, cy, x1, y1, x, y);
                        lastQuad = {x: x1, y: y1};
                        cx = x;
                        cy = y;
                    }
                } else if (C === 'T') {
                    ensureFragment();
                    while (i + 1 < tokens.length && typeof tokens[i] === 'number') {
                        let x = tokens[i], y = tokens[i + 1];
                        i += 2;
                        if (rel) { x += cx; y += cy; }
                        const x1 = lastQuad ? 2 * cx - lastQuad.x : cx;
                        const y1 = lastQuad ? 2 * cy - lastQuad.y : cy;
                        sampleQuadratic(current, cx, cy, x1, y1, x, y);
                        lastQuad = {x: x1, y: y1};
                        cx = x;
                        cy = y;
                    }
                } else if (C === 'A') {
                    ensureFragment();
                    while (i + 6 < tokens.length && typeof tokens[i] === 'number') {
                        const rx = tokens[i], ry = tokens[i + 1], rot = tokens[i + 2];
                        const fA = tokens[i + 3], fS = tokens[i + 4];
                        let x = tokens[i + 5], y = tokens[i + 6];
                        i += 7;
                        if (rel) { x += cx; y += cy; }
                        if (rx === 0 || ry === 0) {
                            addPoint(x, y);
                        } else {
                            sampleArc(current, cx, cy, rx, ry, rot, fA, fS, x, y);
                            cx = x;
                            cy = y;
                        }
                    }
                } else if (C === 'Z') {
                    if (current !== null) {
                        const last = current[current.length - 1];
                        if (Math.hypot(last.x - sx, last.y - sy) > 1e-9) {
                            current.push({x: sx, y: sy});
                        }
                        cx = sx;
                        cy = sy;
                        current = null;
                    }
                }
                if (C !== 'C' && C !== 'S') lastCubic = null;
                if (C !== 'Q' && C !== 'T') lastQuad = null;
            }
            return fragments;
        }

        function num(el, name) {
            const v = parseFloat(el.getAttribute(name));
            return Number.isFinite(v) ? v : 0;
        }

        function parseLine(path) {
            const x1 = num(path, 'x1');
            const y1 = num(path, 'y1');
            const x2 = num(path, 'x2');
            const y2 = num(path, 'y2');
            return new Array({x: x1, y: y1}, {x: x2, y: y2});
        }

        function parsePolyline(path) {
            const points = new Array();
            const raw = path.getAttribute('points');
            if (raw === null || raw.trim() === '') return points;
            const coords = raw.trim().split(/[,\s]+/);
            for (let i = 0; i < coords.length - 1; i += 2) {
                points.push({x: parseFloat(coords[i]), y: parseFloat(coords[i+1])});
            }
            return points;
        }

        function parseCircle(path) {
            const points = new Array();
            const cx = num(path, 'cx');
            const cy = num(path, 'cy');
            const r = num(path, 'r');
            if (!(r > 0)) return points;
            for (let i = 0; i < 360; i++) {
                const t = 2 * Math.PI * i / 360;
                points.push({
                    x: cx + r * Math.cos(t),
                    y: cy + r * Math.sin(t)
                });
            }
            return points;
        }

        // Arc-length sampling
        function sampleByArcLength(points, numSamples) {
            if (points.length === 0) return [];
            const sampled = [];
            const totalLength = computeArcLength(points);
            const step = totalLength / numSamples;
            let dist = 0;
            let i = 0;
            for (let s = 0; s < numSamples; s++) {
                const targetDist = s * step;
                while (i < points.length - 1 && dist + segmentLength(points[i], points[i+1]) < targetDist) {
                    dist += segmentLength(points[i], points[i+1]);
                    i++;
                }
                if (i < points.length - 1) {
                    const segLen = segmentLength(points[i], points[i+1]);
                    const frac = (targetDist - dist) / segLen;
                    sampled.push({
                        x: points[i].x + frac * (points[i+1].x - points[i].x),
                        y: points[i].y + frac * (points[i+1].y - points[i].y)
                    });
                } else {
                    sampled.push(points[points.length - 1]);
                }
            }
            return sampled;
        }

        function computeArcLength(points) {
            let total = 0;
            for (let i = 0; i < points.length - 1; i++) {
                total += segmentLength(points[i], points[i+1]);
            }
            return total;
        }

        function segmentLength(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Fragment stitching: nearest-neighbour + 2-opt over fragment end points.
        function stitchFragments(fragments) {
            const n = fragments.length;
            if (n === 0) return [];

            function orientedEnd(f) {
                const pts = fragments[f.idx];
                return f.rev ? pts[0] : pts[pts.length - 1];
            }
            function orientedStart(f) {
                const pts = fragments[f.idx];
                return f.rev ? pts[pts.length - 1] : pts[0];
            }
            function dist(p, q) {
                const dx = p.x - q.x;
                const dy = p.y - q.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // Nearest-neighbour order over fragment end points.
            let seq = [{idx: 0, rev: false}];
            const used = new Array(n).fill(false);
            used[0] = true;
            for (let s = 1; s < n; s++) {
                const cur = orientedEnd(seq[seq.length - 1]);
                let best = -1, bestRev = false, bestDist = Infinity;
                for (let i = 0; i < n; i++) {
                    if (used[i]) continue;
                    const pts = fragments[i];
                    const dStart = Math.hypot(cur.x - pts[0].x, cur.y - pts[0].y);
                    const dEnd = Math.hypot(cur.x - pts[pts.length - 1].x, cur.y - pts[pts.length - 1].y);
                    if (dStart <= dEnd) {
                        if (dStart < bestDist) { bestDist = dStart; best = i; bestRev = false; }
                    } else {
                        if (dEnd < bestDist) { bestDist = dEnd; best = i; bestRev = true; }
                    }
                }
                used[best] = true;
                seq.push({idx: best, rev: bestRev});
            }

            // 2-opt: reverse a run of fragments (and each fragment in it) when
            // that shortens the total jump length of the closed tour. Reversing a
            // run keeps every internal jump the same (distance is symmetric), so
            // only the two boundary jumps change and the delta is O(1).
            for (let pass = 0; pass < 50; pass++) {
                let improved = false;
                for (let i = 0; i < n; i++) {
                    for (let j = i + 1; j < n; j++) {
                        if (j - i + 1 === n) continue; // whole tour: no change
                        const a = orientedEnd(seq[(i - 1 + n) % n]);
                        const b = orientedStart(seq[i]);
                        const c = orientedEnd(seq[j]);
                        const d = orientedStart(seq[(j + 1) % n]);
                        const before = dist(a, b) + dist(c, d);
                        const after = dist(a, c) + dist(b, d);
                        if (after < before - 1e-12) {
                            const run = seq.slice(i, j + 1).reverse().map(f => ({idx: f.idx, rev: !f.rev}));
                            seq = seq.slice(0, i).concat(run).concat(seq.slice(j + 1));
                            improved = true;
                        }
                    }
                }
                if (!improved) break;
            }

            // One point list: fragments in order, consecutive duplicates dropped,
            // closed by repeating the first point.
            const out = [];
            for (let i = 0; i < seq.length; i++) {
                const pts = fragments[seq[i].idx];
                const run = seq[i].rev ? pts.slice().reverse() : pts.slice();
                for (let k = 0; k < run.length; k++) {
                    if (out.length > 0) {
                        const last = out[out.length - 1];
                        if (Math.hypot(last.x - run[k].x, last.y - run[k].y) > 1e-9) {
                            out.push({x: run[k].x, y: run[k].y});
                        }
                    } else {
                        out.push({x: run[k].x, y: run[k].y});
                    }
                }
            }
            out.push({x: out[0].x, y: out[0].y});
            return out;
        }

        // Resample to 2^n points
        function resampleToPowerOfTwo(points, n) {
            const size = Math.pow(2, n);
            return sampleByArcLength(points, size);
        }

        function fitToSize(points, size) {
            if (points.length === 0) return [];
            const centered = centerPoints(points);
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < centered.length; i++) {
                if (centered[i].x < minX) minX = centered[i].x;
                if (centered[i].x > maxX) maxX = centered[i].x;
                if (centered[i].y < minY) minY = centered[i].y;
                if (centered[i].y > maxY) maxY = centered[i].y;
            }
            const bw = maxX - minX;
            const bh = maxY - minY;
            if (bw === 0 && bh === 0) {
                return centered.map(p => ({x: 0, y: 0}));
            }
            const scale = size / Math.max(bw, bh);
            return centered.map(p => ({x: p.x * scale, y: p.y * scale}));
        }

        function centerPoints(points) {
            let cx = 0, cy = 0;
            const N = points.length;
            for (let i = 0; i < N; i++) {
                cx += points[i].x;
                cy += points[i].y;
            }
            cx /= N;
            cy /= N;
            return points.map(p => ({ x: p.x - cx, y: p.y - cy }));
        }

        function speedFromSlider(value) {
            const i = Math.max(0, Math.min(SPEED_STEPS.length - 1, value));
            return SPEED_STEPS[i];
        }

        const LAP = 2 * Math.PI;

        function trailLifetime(fadePercent) {
            return (1 - fadePercent / 100) * LAP;
        }

        function trailAlpha(age, lifetime) {
            return Math.max(0, Math.min(1, 1 - age / lifetime));
        }

        function pruneTrail(trail, now, lifetime) {
            return trail.filter(p => now - p.t < lifetime);
        }

        function appendTrail(trail, point, paused, max) {
            if (paused) {
                return trail;
            }
            const newTrail = trail.concat([point]);
            if (newTrail.length > max) {
                return newTrail.slice(newTrail.length - max);
            }
            return newTrail;
        }

        // Parametric butterfly shape
        function generateButterflyPath(N) {
            const points = [];
            for (let i = 0; i < N; i++) {
                const t = Math.PI * i / N;
                // Butterfly parametric equation
                const r = Math.cos(3 * t);
                const x = r * Math.cos(t);
                const y = r * Math.sin(t);
                points.push({x: x * 100, y: y * 100});
            }
            return points;
        }

        // Compute position of the tip of the epicycle chain at time t
        function getChainTip(coeffs, t, n) {
            let x = 0, y = 0;
            for (let i = 0; i < n; i++) {
                const c = coeffs[i];
                const angle = c.speed * t + c.phase;
                x += c.radius * Math.cos(angle);
                y += c.radius * Math.sin(angle);
            }
            return {x, y};
        }

        // Reconstruct a point on the shape from both chains (centred coordinates)
        function reconstructPoint(coeffs, t, n) {
            let x = 0, y = 0;
            for (let i = 0; i < n; i++) {
                const cx = coeffs.x[i];
                const cy = coeffs.y[i];
                const ax = cx.speed * t + cx.phase;
                const ay = cy.speed * t + cy.phase;
                x += cx.radius * Math.cos(ax);
                y += cy.radius * Math.cos(ay);
            }
            return {x, y};
        }

        // Reconstruct the truncated spectrum on the native grid of N points with
        // the inverse FFT (O(N log N)). computeFourier stores radius = |c|/N while
        // ifft divides by N again, so the spectrum bins carry N-scaled values.
        // Returns {x: [...], y: [...]}, the two real signals on the native grid.
        function reconstructSpectrum(coeffs, n, N) {
            const xSpec = new Array(N);
            const ySpec = new Array(N);
            for (let i = 0; i < N; i++) {
                xSpec[i] = {re: 0, im: 0};
                ySpec[i] = {re: 0, im: 0};
            }
            function place(spec, h) {
                const k = h.speed;
                const r = h.radius;
                const p = h.phase;
                if (k === 0) {
                    spec[0].re += N * r * Math.cos(p);
                    spec[0].im += N * r * Math.sin(p);
                } else {
                    const idx = ((k % N) + N) % N;
                    const neg = (((-k) % N) + N) % N;
                    const halfRe = (N * r / 2) * Math.cos(p);
                    const halfIm = (N * r / 2) * Math.sin(p);
                    spec[idx].re += halfRe;
                    spec[idx].im += halfIm;
                    spec[neg].re += halfRe;
                    spec[neg].im -= halfIm;
                }
            }
            const count = Math.min(n, coeffs.x.length, coeffs.y.length);
            for (let i = 0; i < count; i++) {
                place(xSpec, coeffs.x[i]);
                place(ySpec, coeffs.y[i]);
            }
            const xRec = ifft(xSpec);
            const yRec = ifft(ySpec);
            const x = new Array(N);
            const y = new Array(N);
            for (let i = 0; i < N; i++) {
                x[i] = xRec[i].re;
                y[i] = yRec[i].re;
            }
            return {x, y};
        }

        // Compute RMS error between reconstruction (using n epicycles) and original path
        // Returns normalized error as percentage
        function computeRMSError(originalPoints, coeffs, n, spectrum) {
            const N = originalPoints.length;
            if (N === 0) return 0;

            // Compute original path bbox diagonal
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < N; i++) {
                if (originalPoints[i].x < minX) minX = originalPoints[i].x;
                if (originalPoints[i].x > maxX) maxX = originalPoints[i].x;
                if (originalPoints[i].y < minY) minY = originalPoints[i].y;
                if (originalPoints[i].y > maxY) maxY = originalPoints[i].y;
            }
            const diag = Math.sqrt((maxX - minX) ** 2 + (maxY - minY) ** 2);
            if (diag === 0) return 0;

            const rec = spectrum || reconstructSpectrum(coeffs, n, N);

            // Sum of squared differences at each sample point (O(N))
            let sumSquaredError = 0;
            for (let i = 0; i < N; i++) {
                const dx = rec.x[i] - originalPoints[i].x;
                const dy = rec.y[i] - originalPoints[i].y;
                sumSquaredError += dx * dx + dy * dy;
            }
            const mse = sumSquaredError / N;
            const rmse = Math.sqrt(mse);

            // Normalize by bbox diagonal and return as percentage
            return (rmse / diag) * 100;
        }

        // The drawing area's insets for a given window width: the left menu on a
        // wide window, the top bar on a narrow one.
        function drawingInsets(width) {
            if (width > MENU_BREAKPOINT) {
                return {left: MENU_INSET, top: 0};
            }
            return {left: 0, top: TOPBAR_INSET};
        }

        // Compute origin positions for the two chains, inside the drawing area
        // [insets.left, width] x [insets.top, height]. R_x and R_y are the sums of
        // the drawn radii (> 0.5) of each chain. Each chain is offset from the
        // card/bar edge by its own reach, on both axes, so a chain never reaches
        // into the menu card (left) or the top bar (top): the x chain's x is at
        // least R_x from the left edge and its y at least R_x from the top, and
        // likewise the y chain. On a wide window the reach also sets the shape
        // centre, so a shape whose radii exceed half the area is pushed clear of
        // the card rather than drawn under it.
        function chainOrigins(width, height, insets) {
            insets = insets || {left: 0, top: 0};
            const areaW = width - insets.left;
            const areaH = height - insets.top;
            let rx = 0, ry = 0;
            const n = Math.min(numEpicycles, coeffs.x.length, coeffs.y.length);
            for (let i = 0; i < n; i++) {
                if (coeffs.x[i].radius > 0.5) rx += coeffs.x[i].radius;
                if (coeffs.y[i].radius > 0.5) ry += coeffs.y[i].radius;
            }
            return {
                x: {x: insets.left + Math.max(areaW / 2, rx), y: insets.top + Math.max(0.15 * areaH, rx)},
                y: {x: insets.left + Math.max(0.15 * areaW, ry), y: insets.top + Math.max(areaH / 2, ry)}
            };
        }

        // Draw one epicycle chain at time t, return tip position
        function drawChain(ctx, coeffs, t, n, originX, originY, color) {
            let prevX = originX, prevY = originY;
            for (let i = 0; i < n; i++) {
                const c = coeffs[i];
                const angle = c.speed * t + c.phase;
                const endX = prevX + c.radius * Math.cos(angle);
                const endY = prevY + c.radius * Math.sin(angle);

                // Draw circle (only if radius > 0.5px)
                if (c.radius > 0.5) {
                    ctx.beginPath();
                    ctx.arc(prevX, prevY, c.radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Draw connecting line
                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.stroke();

                prevX = endX;
                prevY = endY;
            }
            return {x: prevX, y: prevY};
        }

        // Main animation loop
        let t = 0;
        let errorComputed = false;
        let drawingPoint = {x: 0, y: 0};
        let trail = [];
        let paused = false;
        let speed = 1;
        let showOriginal = false;
        let originalPath = null;
        let lastError = null;
        let lastErrorN = null;
        let fade = 0.5;

        // M2: shape-derived frame step, the trail draw budget, and the fit scale.
        // PX_PER_UNIT is the owl's present pace at start-up (0.01 * its mean pen
        // speed at n = 1024 on the 800x600 reference canvas), so the default lap
        // keeps the pace the user approved.
        let penSpeed = 0;
        let fitScale = 1;
        let MAX_TRAIL_POINTS = 8000;
        // The step of the last unpaused frame: while paused the trail keeps its
        // lifetime, so nothing fades when the speed slider moves.
        let frozenStep = null;
        const REF_FIT = 300;
        const PX_PER_UNIT = 2;
        const MIN_SPEED = 1;
        // Layout: the left menu card and the drawing area to its right, plus the
        // narrow-window top bar. FIT_FRACTION sizes the shape inside that area.
        const MENU_INSET = 296;
        const TOPBAR_INSET = 56;
        const MENU_BREAKPOINT = 720;
        const FIT_FRACTION = 0.5;

        // The mean pen speed over one lap, in pixels per radian: the closed
        // perimeter of the native-grid reconstruction divided by LAP. Pass the
        // spectrum to reuse one ifft pair per N change.
        function meanPenSpeed(coeffs, n, N, spectrum) {
            if (N <= 0) return 0;
            const rec = spectrum || reconstructSpectrum(coeffs, n, N);
            let perimeter = 0;
            let px = rec.x[0], py = rec.y[0];
            for (let i = 1; i < N; i++) {
                perimeter += Math.hypot(rec.x[i] - px, rec.y[i] - py);
                px = rec.x[i];
                py = rec.y[i];
            }

        // Generate the default shape (owl) through the same import pipeline as a loaded SVG
        let owlPoints = stitchFragments([parsePolyline({ getAttribute: n => n === 'points' ? OWL_POINTS : null })]);

        // N slider (log2 scale: 0→1, 1→2, ..., 13→8192)
        document.getElementById('nSlider').addEventListener('input', function() {
            applySliders();
            t = 0;
            trail = [];
        });

        document.getElementById('speedSlider').addEventListener('input', applySliders);

        // Fade slider

        // Re-read sliders on pageshow (Firefox keeps range values on refresh)
        window.addEventListener('pageshow', applySliders);

        // Menu toggle: on a narrow window the card is a top bar and this opens
        // its controls as a sheet.
        document.getElementById('menuToggle').addEventListener('click', function() {
            const menu = document.getElementById('menu');
            menu.className = menu.className === 'open' ? '' : 'open';
        });

        // Theme switch: flips the page palette; the segments stay in the markup.
        document.getElementById('themeSwitch').addEventListener('click', function() {
            theme = theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            try { localStorage.setItem('fourierTheme', theme); } catch (e) {}
        });

        // Pause button
        document.getElementById('pauseBtn').addEventListener('click', function() {
            paused = !paused;
            document.getElementById('pauseLabel').textContent = paused ? 'Resume' : 'Pause';
            document.getElementById('pauseBtn').setAttribute('data-paused', paused ? 'true' : 'false');
        });

        // Show original button
        document.getElementById('originalBtn').addEventListener('click', function() {
            showOriginal = !showOriginal;
            if (showOriginal) {
                this.textContent = 'Hide original';
            } else {
                this.textContent = 'Show original';
            }
        });

        function animate() {
            const colors = THEME_COLORS[theme];

            // Clear canvas
            ctx.fillStyle = colors.clear;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const step = frameStep(penSpeed, speed);
            if (!paused) {
                t += step;
                frozenStep = step;
            }

            const origins = chainOrigins(canvas.width, canvas.height, drawingInsets(canvas.width));
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw x chain (top, horizontal)
            const xEnd = drawChain(ctx, coeffs.x, t, numEpicycles, origins.x.x, origins.x.y, colors.chainX);

            // Draw y chain (left, vertical - rotated by π/2)
            let yPrevX = origins.y.x;
            let yPrevY = origins.y.y;
            for (let i = 0; i < numEpicycles; i++) {
                const c = coeffs.y[i];
                const angle = c.speed * t + c.phase;
                // Rotate by π/2: cos becomes -sin, sin becomes cos
                const yEndX = yPrevX - c.radius * Math.sin(angle);
                const yEndY = yPrevY + c.radius * Math.cos(angle);
                if (c.radius > 0.5) {
                    ctx.beginPath();
                    ctx.arc(yPrevX, yPrevY, c.radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = colors.chainY;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.moveTo(yPrevX, yPrevY);
                ctx.lineTo(yEndX, yEndY);
                ctx.strokeStyle = colors.chainY;
                ctx.lineWidth = 1;
                ctx.stroke();
                yPrevX = yEndX;
                yPrevY = yEndY;
            }
            const yEnd = {x: yPrevX, y: yPrevY};

            // Get reconstruction point
            const point = reconstructPoint(coeffs, t, numEpicycles);
            const px = origins.x.x + point.x;
            const py = origins.y.y + point.y;
            drawingPoint = {x: px, y: py};

            // Draw dashed lines from chain ends to drawing point
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = colors.connector;
            ctx.lineWidth = 1;

            // From x chain end
            ctx.beginPath();
            ctx.moveTo(xEnd.x, xEnd.y);
            ctx.lineTo(px, py);
            ctx.stroke();

            // From y chain end
            ctx.beginPath();
            ctx.moveTo(yEnd.x, yEnd.y);
            ctx.lineTo(px, py);
            ctx.stroke();

            ctx.setLineDash([]);

            // Original path overlay
            if (showOriginal && originalPath) {
                ctx.beginPath();
                ctx.strokeStyle = colors.overlay;
                ctx.lineWidth = OVERLAY_WIDTH;
                for (let i = 0; i < originalPath.length; i++) {
                    const p = originalPath[i];
                    const x = origins.x.x + p.x;
                    const y = origins.y.y + p.y;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Trail
            const trailStep = (paused && frozenStep !== null) ? frozenStep : step;
            const lifetime = effectiveLifetime(fade, trailStep, MAX_TRAIL_POINTS);
            trail = appendTrail(trail, {x: px, y: py, t: t}, paused, MAX_TRAIL_POINTS);
            trail = pruneTrail(trail, t, lifetime);

            // Draw trail
            for (let i = 0; i < trail.length; i++) {
                const pt = trail[i];
                const alpha = trailAlpha(t - pt.t, lifetime);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, TRAIL_RADIUS, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(' + colors.trail + ', ' + alpha + ')';
                ctx.fill();
            }

            // Join consecutive trail points into a continuous stroke
            for (let i = 1; i < trail.length; i++) {
                const alpha = trailAlpha(t - trail[i - 1].t, lifetime);
                ctx.beginPath();
                ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                ctx.lineTo(trail[i].x, trail[i].y);
                ctx.lineWidth = 2 * TRAIL_RADIUS;
                ctx.strokeStyle = 'rgba(' + colors.trail + ', ' + alpha + ')';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // Draw drawing point
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, 2 * Math.PI);
            ctx.fillStyle = colors.pen;
            ctx.fill();

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // SVG import
        document.getElementById('svgBtn').addEventListener('click', function() {
            document.getElementById('svgInput').click();
        });

        document.getElementById('svgInput').addEventListener('change', function(e) {
            const input = e.target;
            const file = input.files[0];
            if (!file) return;
            input.value = '';

            const reader = new FileReader();
            reader.onload = function(ev) {
                const svgText = ev.target.result;
                const fragments = parseSVG(svgText);
                if (fragments.length > 0) {
                    // Stitch fragments into one closed path
                    let points = stitchFragments(fragments);
                    // Resample to 8192 points
                    points = resampleToPowerOfTwo(points, 13);
                    // Scale to fit canvas
                    const fitSize = FIT_FRACTION * Math.min(canvas.width - drawingInsets(canvas.width).left, canvas.height - drawingInsets(canvas.width).top);
                    points = fitToSize(points, fitSize);
                    fitScale = fitSize / REF_FIT;
                    // Compute Fourier coefficients
                    coeffs = computeFourier(points);
                    // Store original path for error computation
                    originalPath = points;
                    // Reset animation
                    t = 0;
                    trail = [];
                    lastErrorN = null;
                    applySliders();
                }
            };
            reader.readAsText(file);
        });
